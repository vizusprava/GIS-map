name: Deploy GIS Map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nasazení na Pages se nesmí překrývat; rozdělaný deploy se ale nechá dojet.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` = tsc --noEmit + vite build. Typová chyba tedy shodí deploy,
      # což je záměr: rozbitý build se nemá dostat na web.
      # Hodnoty VITE_* se zapékají do bundlu → musí být jako repository secrets
      # (Settings → Secrets and variables → Actions). ANON klíč je veřejný schválně,
      # data chrání RLS; secret je hlavně proto, aby nebyl natvrdo v gitu.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
